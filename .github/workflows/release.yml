name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RENDERCASE_TEST_DATABASE_URL: postgres://postgres:test-password@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test -race -count=1 ./...

  compose:
    name: compose postgres
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: compose-test-password
      RENDERCASE_PUBLIC_URL: https://rendercase.example.com
      RENDERCASE_CONTENT_URL: https://content.rendercase.example.com
      RENDERCASE_COOKIE_SECRET: compose-test-cookie-secret-not-for-production
      RENDERCASE_OIDC_ISSUER: https://id.example.com
      RENDERCASE_OAUTH_AUDIENCE: https://rendercase.example.com/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start PostgreSQL from compose.yaml on a fresh volume
        run: docker compose up -d --wait --wait-timeout 120 postgres
      - name: Check server version and data directory
        run: |
          docker compose exec -T postgres psql -U rendercase -d rendercase -Atc 'show server_version' | tee version
          docker compose exec -T postgres psql -U rendercase -d rendercase -Atc 'show data_directory'
          image_major=$(sed -n 's/.*image: postgres:\([0-9]*\)-.*/\1/p' compose.yaml)
          grep -q "^${image_major}\." version
      - name: Show PostgreSQL logs
        if: failure()
        run: docker compose logs postgres
      - name: Clean up
        if: always()
        run: docker compose down --volumes

  docker:
    needs: [test, compose]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
      - name: Build static Linux binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o dist/rendercase-linux-$arch ./cmd/rendercase
            GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o dist/rendercase-cli-linux-$arch ./cmd/rendercase-cli
            GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o dist/rendercase-mtls-proxy-linux-$arch ./cmd/rendercase-mtls-proxy
          done
          (cd dist && sha256sum rendercase-* > SHA256SUMS)
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/rendercase-linux-amd64
            dist/rendercase-linux-arm64
            dist/rendercase-cli-linux-amd64
            dist/rendercase-cli-linux-arm64
            dist/rendercase-mtls-proxy-linux-amd64
            dist/rendercase-mtls-proxy-linux-arm64
            dist/SHA256SUMS
