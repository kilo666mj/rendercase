services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rendercase
      POSTGRES_USER: rendercase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rendercase"]
      interval: 5s
      timeout: 5s
      retries: 10

  rendercase:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18100:18100"
    environment:
      RENDERCASE_LISTEN: 0.0.0.0:18100
      RENDERCASE_PUBLIC_URL: ${RENDERCASE_PUBLIC_URL:?set RENDERCASE_PUBLIC_URL in .env}
      RENDERCASE_CONTENT_URL: ${RENDERCASE_CONTENT_URL:?set RENDERCASE_CONTENT_URL in .env}
      RENDERCASE_DATABASE_URL: postgres://rendercase:${POSTGRES_PASSWORD}@postgres:5432/rendercase?sslmode=disable
      RENDERCASE_STORAGE_BACKEND: ${RENDERCASE_STORAGE_BACKEND:-filesystem}
      RENDERCASE_STORAGE_ROOT: /var/lib/rendercase/artifacts
      RENDERCASE_S3_BUCKET: ${RENDERCASE_S3_BUCKET:-}
      RENDERCASE_S3_PREFIX: ${RENDERCASE_S3_PREFIX:-}
      RENDERCASE_S3_REGION: ${RENDERCASE_S3_REGION:-us-east-1}
      RENDERCASE_S3_ENDPOINT: ${RENDERCASE_S3_ENDPOINT:-}
      RENDERCASE_S3_USE_PATH_STYLE: ${RENDERCASE_S3_USE_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      RENDERCASE_COOKIE_SECRET: ${RENDERCASE_COOKIE_SECRET:?set RENDERCASE_COOKIE_SECRET in .env}
      RENDERCASE_AUTH_MODE: ${RENDERCASE_AUTH_MODE:-oidc}
      RENDERCASE_OIDC_ISSUER: ${RENDERCASE_OIDC_ISSUER:?set RENDERCASE_OIDC_ISSUER in .env}
      RENDERCASE_OIDC_CLIENT_ID: ${RENDERCASE_OIDC_CLIENT_ID:-}
      RENDERCASE_OIDC_CLIENT_SECRET: ${RENDERCASE_OIDC_CLIENT_SECRET:-}
      RENDERCASE_OIDC_REDIRECT_URL: ${RENDERCASE_OIDC_REDIRECT_URL:-}
      RENDERCASE_CF_ACCESS_TEAM_DOMAIN: ${RENDERCASE_CF_ACCESS_TEAM_DOMAIN:-}
      RENDERCASE_CF_ACCESS_AUD: ${RENDERCASE_CF_ACCESS_AUD:-}
      RENDERCASE_ADMIN_SUBJECTS: ${RENDERCASE_ADMIN_SUBJECTS:-}
      RENDERCASE_ADMIN_GROUPS: ${RENDERCASE_ADMIN_GROUPS:-}
      RENDERCASE_OAUTH_AUDIENCE: ${RENDERCASE_OAUTH_AUDIENCE:?set RENDERCASE_OAUTH_AUDIENCE in .env}
      RENDERCASE_TRUSTED_PROXIES: ${RENDERCASE_TRUSTED_PROXIES:-}
    volumes:
      - artifact-data:/var/lib/rendercase/artifacts

volumes:
  artifact-data:
  postgres-data:
